name: Product Readiness Checks

on:
  push:
    branches:
      - main
      - "apex-one/**"
  pull_request:
    branches:
      - main
      - "apex-one/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/profit-leak-app.js').write_text(scripts[0], encoding='utf-8')
          print('Extracted JS lines:', len(scripts[0].splitlines()))
          print('Extracted JS tail:', repr(scripts[0][-160:]))
          PY
          wc -l /tmp/profit-leak-app.js
          tail -n 5 /tmp/profit-leak-app.js
          node --check /tmp/profit-leak-app.js
